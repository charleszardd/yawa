name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/yawa-ui/frontend/package-lock.json
      - working-directory: cmd/yawa-ui/frontend
        run: npm ci
      - working-directory: cmd/yawa-ui/frontend
        run: npm run build
      - run: go test ./...
      - run: go vet ./...
      - name: Create build output directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force .\dist | Out-Null
      - run: go build -trimpath -o dist/yawa.exe ./cmd/yawa
      - run: go build -trimpath -ldflags "-H windowsgui" -o dist/yawa-agent.exe ./cmd/yawa-agent
      - run: go build -tags production -trimpath -ldflags "-H windowsgui" -o dist/yawa-ui.exe ./cmd/yawa-ui
